<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>两种输出分别算误差，再共同更新共享参数</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">两种输出分别算误差，再共同更新共享参数</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">归一化损失示意</text>
<rect x="30" y="75" width="370" height="225" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="46" y="103" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">文字位置：预测下一个词元</text>
<text x="52" y="135" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">目标词</text>
<rect x="136" y="117" width="175" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="136" y="117" width="122.49999999999999" height="22" rx="4" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="321" y="135" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="start">0.7</text>
<text x="52" y="176" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="start">其他甲</text>
<rect x="136" y="158" width="175" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="136" y="158" width="35.0" height="22" rx="4" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="321" y="176" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="start">0.2</text>
<text x="52" y="217" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="start">其他乙</text>
<rect x="136" y="199" width="175" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="136" y="199" width="17.5" height="22" rx="4" fill="#b77b38" stroke="none" stroke-width="1"/>
<text x="321" y="217" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#b77b38" text-anchor="start">0.1</text>
<text x="52" y="277" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">文字损失：−ln(0.7) ≈ 0.357</text>
<rect x="435" y="75" width="375" height="225" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="451" y="103" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">图像位置：预测已加入的噪声</text>
<text x="458" y="135" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="start">四个位置的预测误差</text>
<rect x="458" y="155" width="70" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="493.0" y="182.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">0.1</text>
<rect x="541" y="155" width="70" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="576.0" y="182.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">−0.1</text>
<rect x="624" y="155" width="70" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="659.0" y="182.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">0.2</text>
<rect x="707" y="155" width="70" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="742.0" y="182.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">0.0</text>
<text x="458" y="240" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="20" font-weight="400" fill="#47768a" text-anchor="start">平方后取平均：0.015</text>
<text x="458" y="277" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="start">图像损失：平均平方误差</text>
<text x="420" y="334" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="21" font-weight="400" fill="#35533c" text-anchor="middle">总损失 = 文字损失 + 2 × 图像损失 ≈ 0.387</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">示例图像权重为 2；各自先按监督位置平均，再合并损失更新共享网络。</text>
</svg>