<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>递归层保留汇总状态，注意力层保留按位置访问</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">递归层保留汇总状态，注意力层保留按位置访问</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">两种存储结构示意</text>
<rect x="30" y="71" width="370" height="264" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="46" y="99" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">递归状态：固定容量</text>
<text x="52" y="130" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="20" font-weight="400" fill="#35533c" text-anchor="start">旧状态 s = [2, 1]</text>
<text x="52" y="176" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="20" font-weight="400" fill="#47768a" text-anchor="start">新输入 x = [4, 0]</text>
<text x="52" y="222" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="400" fill="#b77b38" text-anchor="start">s′ = 0.8s + 0.2x</text>
<rect x="52" y="253" width="144" height="49" rx="7" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="124.0" y="283.5" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">[2.4, 0.8]</text>
<text x="215" y="284" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">仍是 2 个数</text>
<rect x="435" y="71" width="375" height="264" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="451" y="99" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">注意力历史：逐项保留</text>
<text x="455" y="146" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="start">位置 1</text>
<rect x="554" y="118" width="178" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="643.0" y="145.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">[2, 1]</text>
<text x="455" y="204" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="start">位置 2</text>
<rect x="554" y="176" width="178" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="643.0" y="203.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">[4, 0]</text>
<text x="455" y="262" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="start">位置 3</text>
<rect x="554" y="234" width="178" height="42" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="643.0" y="261.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">[1, 3]</text>
<text x="454" y="317" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="start">当前查询可以按位置读取旧内容</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">左侧用指数滑动平均演示递归压缩；混合模型可在不同层安排递归状态与注意力缓存。</text>
</svg>