<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">把预测误差看成图上的距离</title><desc id="desc">橙色虚线连接预测与答案；平方误差把这段有方向的差，变成非负惩罚。</desc><rect width="840" height="400" fill="#fff"/><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><text x="50" y="37" font-size="23" fill="#35533c" text-anchor="start" font-weight="600">预测与答案的差，怎样变成损失</text><path d="M75 310L465 310" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M456.22417438109625 314.79425538604204L465 310L456.22417438109625 305.20574461395796" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M75 310L75 105" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M79.79425538604202 113.77582561890372L75 105L70.20574461395798 113.77582561890372" stroke="#657461" stroke-width="2.5" fill="none"/><text x="465" y="337" font-size="16" fill="#657461" text-anchor="end" font-weight="400">输入 x</text><text x="70" y="93" font-size="16" fill="#657461" text-anchor="start" font-weight="400">输出 y</text><path d="M90 292L420 127" stroke="#47768a" stroke-width="3" fill="none"/><text x="205" y="145" font-size="18" fill="#47768a" text-anchor="start" font-weight="400">模型预测线</text><path d="M130 272.0L130 272" stroke="#b77b38" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="130" cy="272.0" r="5" fill="#47768a"/><circle cx="130" cy="272" r="6" fill="#b77b38"/><path d="M195 239.5L195 207" stroke="#b77b38" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="195" cy="239.5" r="5" fill="#47768a"/><circle cx="195" cy="207" r="6" fill="#b77b38"/><path d="M260 207.0L260 217" stroke="#b77b38" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="260" cy="207.0" r="5" fill="#47768a"/><circle cx="260" cy="217" r="6" fill="#b77b38"/><path d="M325 174.5L325 132" stroke="#b77b38" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="325" cy="174.5" r="5" fill="#47768a"/><circle cx="325" cy="132" r="6" fill="#b77b38"/><path d="M390 142.0L390 147" stroke="#b77b38" stroke-width="3" fill="none" stroke-dasharray="5 4"/><circle cx="390" cy="142.0" r="5" fill="#47768a"/><circle cx="390" cy="147" r="6" fill="#b77b38"/><rect x="510" y="85" width="285" height="230" rx="9" fill="#f4f7ef" stroke="#d9e3d3"/><text x="535" y="122" font-size="20" fill="#35533c" text-anchor="start" font-weight="500">看同一个输入</text><circle cx="542" cy="156" r="5" fill="#47768a"/><text x="560" y="162" font-size="18" fill="#35533c" text-anchor="start" font-weight="400">预测 2，答案 5</text><text x="535" y="204" font-size="20" fill="#b77b38" text-anchor="start" font-weight="400">误差：2 − 5 = −3</text><text x="535" y="244" font-size="20" fill="#b77b38" text-anchor="start" font-weight="400">平方误差：(−3)² = 9</text><text x="535" y="285" font-size="17" fill="#657461" text-anchor="start" font-weight="400">差距越大，惩罚越大</text><text x="75" y="365" font-size="17" fill="#47768a" text-anchor="start" font-weight="400">蓝点：预测值</text><text x="270" y="365" font-size="17" fill="#b77b38" text-anchor="start" font-weight="400">橙点：已知答案</text><text x="765" y="365" font-size="15" fill="#657461" text-anchor="end" font-weight="400">数值示意</text></g></svg>