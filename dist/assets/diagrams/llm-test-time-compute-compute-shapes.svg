<text x="580" y="304" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#b77b38" text-anchor="start">中间判断决定扩展位置</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">三幅均画 6 个生成步骤；实际总成本还包含验证、工具调用和并行开销。</text>
</svg>