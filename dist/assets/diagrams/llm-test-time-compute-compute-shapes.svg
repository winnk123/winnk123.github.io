<line x1="747" y1="187" x2="747" y2="252" stroke="#b77b38" stroke-width="2"/>
<circle cx="685" cy="130" r="10" fill="#b77b38" stroke="none" stroke-width="1"/>
<circle cx="624" cy="187" r="10" fill="#b77b38" stroke="none" stroke-width="1"/>
<circle cx="747" cy="187" r="10" fill="#b77b38" stroke="none" stroke-width="1"/>
<circle cx="597" cy="252" r="10" fill="#b77b38" stroke="none" stroke-width="1"/>
<circle cx="649" cy="252" r="10" fill="#35533c" stroke="none" stroke-width="1"/>
