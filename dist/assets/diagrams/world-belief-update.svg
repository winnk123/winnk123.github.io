<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc"><title id="title">看见右侧为空，位置概率随之更新</title><desc id="desc">左右两个抽屉最初关闭，对杯子所在位置的先验概率各为二分之一，观察右抽屉为空后更新为左九成右一成。</desc><defs><marker id="arrow-g" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35533c"/></marker><marker id="arrow-b" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#47768a"/></marker><marker id="arrow-o" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b77b38"/></marker><marker id="arrow-m" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617565"/></marker></defs><rect width="840" height="400" rx="18" fill="#f7faf5"/><text x="28" y="37" fill="#35533c" font-size="22" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="700">看见右侧为空，位置概率随之更新</text><path d="M420,65 L420,337" fill="none" stroke="#d6e1d2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="38" y="82" fill="#35533c" font-size="20" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">观察前：两个抽屉关闭</text><text x="452" y="82" fill="#35533c" font-size="20" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">观察后：右侧看到空位</text><rect x="43" y="112" width="118" height="68" rx="5" fill="#e7efe4" stroke="#35533c" stroke-width="2"/><path d="M87,148 L117,148" fill="none" stroke="#35533c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="215" y="112" width="118" height="68" rx="5" fill="#e7efe4" stroke="#35533c" stroke-width="2"/><path d="M259,148 L289,148" fill="none" stroke="#35533c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="75" y="268.0" width="54" height="47.0" rx="4" fill="#35533c" stroke="none" stroke-width="1"/><text x="102" y="258.0" fill="#35533c" font-size="19" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.5</text><text x="102" y="338" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">左侧</text><rect x="247" y="268.0" width="54" height="47.0" rx="4" fill="#47768a" stroke="none" stroke-width="1"/><text x="274" y="258.0" fill="#47768a" font-size="19" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.5</text><text x="274" y="338" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">右侧</text><path d="M53,315 L325,315" fill="none" stroke="#617565" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="463" y="112" width="118" height="68" rx="5" fill="#e7efe4" stroke="#35533c" stroke-width="2"/><path d="M507,148 L537,148" fill="none" stroke="#35533c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="635" y="112" width="118" height="68" rx="5" fill="#e7efe4" stroke="#35533c" stroke-width="2"/><path d="M635,131 L648,170 L743,170 L753,131" fill="#ffffff" stroke="#35533c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="644" y="160" width="102" height="33" rx="3" fill="#ffffff" stroke="#35533c" stroke-width="2"/><path d="M683,176 L709,176" fill="none" stroke="#35533c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="694" y="149" fill="#617565" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">空</text><rect x="495" y="230.39999999999998" width="54" height="84.60000000000001" rx="4" fill="#35533c" stroke="none" stroke-width="1"/><text x="522" y="220.39999999999998" fill="#35533c" font-size="19" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.9</text><text x="522" y="338" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">左侧</text><rect x="667" y="305.6" width="54" height="9.4" rx="4" fill="#47768a" stroke="none" stroke-width="1"/><text x="694" y="295.6" fill="#47768a" font-size="19" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.1</text><text x="694" y="338" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">右侧</text><path d="M473,315 L745,315" fill="none" stroke="#617565" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M378,158 L445,158" fill="none" stroke="#b77b38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-o)"/><text x="205" y="220" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">先验概率</text><text x="620" y="220" fill="#617565" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">结合观测后的概率</text><path d="M28,355 L812,355" fill="none" stroke="#d6e1d2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="28" y="381" fill="#617565" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">示意：先验各 0.5；该观测的左右似然为 0.9 / 0.1，后验为 0.9 / 0.1。</text></svg>