<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">反向传播沿局部导数相乘</title><desc id="desc">蓝箭头计算预测和损失；橙箭头把局部导数相乘，得到参数该往哪个方向调整。</desc><rect width="840" height="400" fill="#fff"/><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><text x="50" y="37" font-size="23" fill="#35533c" text-anchor="start" font-weight="600">沿计算链，把误差传回参数</text><text x="50" y="72" font-size="18" fill="#657461" text-anchor="start" font-weight="400">示意模型：p = wx；输入 x = 2，目标 y = 3</text><rect x="50" y="133" width="175" height="90" rx="9" fill="#fff" stroke="#35533c"/><text x="137.5" y="165" font-size="21" fill="#35533c" text-anchor="middle" font-weight="500">w = 1</text><text x="137.5" y="194" font-size="16" fill="#657461" text-anchor="middle" font-weight="400">当前参数</text><rect x="332" y="133" width="175" height="90" rx="9" fill="#fff" stroke="#47768a"/><text x="419.5" y="165" font-size="21" fill="#47768a" text-anchor="middle" font-weight="500">p = 2</text><text x="419.5" y="194" font-size="16" fill="#657461" text-anchor="middle" font-weight="400">乘以 x = 2</text><rect x="615" y="133" width="175" height="90" rx="9" fill="#fff" stroke="#b77b38"/><text x="702.5" y="165" font-size="21" fill="#b77b38" text-anchor="middle" font-weight="500">L = 0.5</text><text x="702.5" y="194" font-size="16" fill="#657461" text-anchor="middle" font-weight="400">½(p − y)²</text><path d="M232 177L320 177" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M311.22417438109625 181.79425538604204L320 177L311.22417438109625 172.20574461395796" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M515 177L603 177" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M594.2241743810963 181.79425538604204L603 177L594.2241743810963 172.20574461395796" stroke="#47768a" stroke-width="2.5" fill="none"/><text x="275" y="150" font-size="16" fill="#47768a" text-anchor="middle" font-weight="400">预测</text><text x="560" y="150" font-size="16" fill="#47768a" text-anchor="middle" font-weight="400">比较</text><path d="M690 257L420 257" stroke="#b77b38" stroke-width="2.5" fill="none"/><path d="M428.77582561890375 252.20574461395796L420 257L428.77582561890375 261.79425538604204" stroke="#b77b38" stroke-width="2.5" fill="none"/><path d="M420 298L137 298" stroke="#b77b38" stroke-width="2.5" fill="none"/><path d="M145.77582561890372 293.20574461395796L137 298L145.77582561890372 302.79425538604204" stroke="#b77b38" stroke-width="2.5" fill="none"/><text x="554" y="287" font-size="18" fill="#b77b38" text-anchor="middle" font-weight="400">∂L/∂p = −1</text><text x="275" y="331" font-size="18" fill="#b77b38" text-anchor="middle" font-weight="400">∂p/∂w = x = 2</text><rect x="48" y="349" width="744" height="34" rx="5" fill="#f4eee3" stroke="#e6d9c0"/><text x="420" y="373" font-size="18" fill="#35533c" text-anchor="middle" font-weight="400">链式法则：∂L/∂w = (−1) × 2 = −2；沿负梯度增大 w</text></g></svg>