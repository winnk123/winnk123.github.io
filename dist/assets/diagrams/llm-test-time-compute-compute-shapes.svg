<rect x="295" y="72" width="250" height="259" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="311" y="100" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">独立生成候选</text>
<rect x="560" y="72" width="250" height="259" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="576" y="100" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">按分支继续搜索</text>
<line x1="54" y1="166" x2="93" y2="166" stroke="#35533c" stroke-width="2"/>
<circle cx="54" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
