<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img"><title>ReAct：行动取得观测，观测改变行动</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#829c71"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect width="840" height="400" rx="15" fill="#f6f8f1"/><text x="28" y="38" font-size="22" fill="#516c45" text-anchor="start" font-weight="600">ReAct：行动取得观测，观测改变行动</text><rect x="35" y="85" width="300" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="50" y="116" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">模型：整理并选择</text><text x="50" y="143" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">目标 + 旧记录 + 最新观察</text><rect x="505" y="85" width="300" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="520" y="116" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">Action：工具名与参数</text><text x="520" y="143" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">模型生成可执行请求</text><rect x="505" y="253" width="300" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="520" y="284" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">程序：执行工具</text><text x="520" y="311" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">实际结果成为 Observation</text><rect x="35" y="253" width="300" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="50" y="284" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">上下文：追加新反馈</text><text x="50" y="311" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">记录行动及对应的返回</text><path d="M335 124H505" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 163V253" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M505 292H335" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 253V163" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="112" font-size="14" fill="#516c45" text-anchor="middle" font-weight="400">提出行动</text><text x="420" y="280" font-size="14" fill="#516c45" text-anchor="middle" font-weight="400">回传观测</text><text x="420" y="215" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">根据新结果再决定下一步</text><text x="28" y="375" font-size="15" fill="#516c45" text-anchor="start" font-weight="400">判断完成后选择 Finish，提交结果并退出循环。</text></g></svg>