<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>KV 缓存随上下文长度线性增长</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">KV 缓存随上下文长度线性增长</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">容量计算示例</text>
<rect x="31" y="69" width="778" height="49" rx="8" fill="#e6eee3" stroke="none" stroke-width="1"/>
<text x="420" y="101" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="21" font-weight="400" fill="#35533c" text-anchor="middle">字节数 = 2 × B × L × T × H_kv × d_h × 每元素字节数</text>
<rect x="31" y="136" width="336" height="198" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="47" y="164" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">固定本例的模型与精度</text>
<text x="51" y="195" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#26372c" text-anchor="start">请求 B = 1；层数 L = 32</text>
<text x="51" y="239" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#26372c" text-anchor="start">键值头 H_kv = 8；头宽 d_h = 128</text>
<text x="51" y="283" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#26372c" text-anchor="start">每个数 2 字节；K 与 V 各一份</text>
<text x="412" y="163" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="start">上下文长度 T</text>
<text x="759" y="163" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#637265" text-anchor="end">缓存 GiB</text>
<text x="410" y="205" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">2048</text>
<rect x="488" y="187" width="240" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="488" y="187" width="60.0" height="22" rx="4" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="785" y="205" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="end">0.25</text>
<text x="410" y="258" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">4096</text>
<rect x="488" y="240" width="240" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="488" y="240" width="120.0" height="22" rx="4" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="785" y="258" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="end">0.50</text>
<text x="410" y="311" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">8192</text>
<rect x="488" y="293" width="240" height="22" rx="4" fill="#e6eee3" stroke="none" stroke-width="1"/>
<rect x="488" y="293" width="240" height="22" rx="4" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="785" y="311" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="end">1.00</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">4096 词元对应 536,870,912 字节 = 0.5 GiB；这里单独计算 KV 缓存。</text>
</svg>