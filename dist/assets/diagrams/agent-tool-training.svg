<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img"><title>工具能力：从数据筛选到实际执行</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#829c71"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect width="840" height="400" rx="15" fill="#f6f8f1"/><text x="28" y="38" font-size="22" fill="#516c45" text-anchor="start" font-weight="600">工具能力：从数据筛选到实际执行</text><text x="30" y="82" font-size="16" fill="#516c45" text-anchor="start" font-weight="600">训练时：学习何时、怎样调用</text><rect x="30" y="98" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="45" y="129" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">候选调用</text><text x="45" y="156" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">从文本提出 API 请求</text><rect x="308" y="98" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="323" y="129" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">执行并筛选</text><text x="323" y="156" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">看返回能否降低预测损失</text><rect x="585" y="98" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="600" y="129" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">增强文本微调</text><text x="600" y="156" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">把有用的调用写入训练数据</text><path d="M255 137H308" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M533 137H585" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="232" font-size="16" fill="#516c45" text-anchor="start" font-weight="600">运行时：执行请求，再利用结果</text><rect x="30" y="250" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="45" y="281" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">当前上下文</text><text x="45" y="308" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">目标、工具说明与历史</text><rect x="308" y="250" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="323" y="281" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">模型提出调用</text><text x="323" y="308" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">生成工具名和参数</text><rect x="585" y="250" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="600" y="281" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">工具返回后续写</text><text x="600" y="308" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">运行时插入实际返回</text><path d="M255 289H308" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M533 289H585" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 176V204H420V249" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="197" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">学到的参数</text><text x="30" y="375" font-size="15" fill="#516c45" text-anchor="start" font-weight="400">Toolformer 用后续文本预测损失筛选训练调用；运行时由程序提供真实工具结果。</text></g></svg>