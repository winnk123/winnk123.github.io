<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img"><title>Agent 强化学习：从交互结果回到参数更新</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#829c71"/></marker></defs><g font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif"><rect width="840" height="400" rx="15" fill="#f6f8f1"/><text x="28" y="38" font-size="22" fill="#516c45" text-anchor="start" font-weight="600">Agent 强化学习：从交互结果回到参数更新</text><rect x="30" y="83" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="45" y="114" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">交互采样</text><text x="45" y="141" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">模型输出与工具返回交替</text><rect x="308" y="83" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="323" y="114" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">任务与过程评分</text><text x="323" y="141" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">评价结果及中间步骤</text><rect x="585" y="83" width="225" height="78" rx="9" fill="#eef4e6" stroke="#c2d2b5"/><text x="600" y="114" font-size="18" fill="#516c45" text-anchor="start" font-weight="600">更新策略参数</text><text x="600" y="141" font-size="14" fill="#516c45" text-anchor="start" font-weight="400">把优势分配给模型动作</text><path d="M255 122H308" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><path d="M533 122H585" fill="none" stroke="#829c71" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="208" font-size="17" fill="#516c45" text-anchor="start" font-weight="600">轨迹里的信息来源</text><rect x="30" y="232" width="145" height="76" rx="7" fill="#e8f1de" stroke="#cad6c0"/><text x="102" y="261" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">模型行动</text><text x="102" y="286" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">可训练输出</text><rect x="190" y="232" width="145" height="76" rx="7" fill="#edf0f1" stroke="#cad6c0"/><text x="262" y="261" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">工具返回</text><text x="262" y="286" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">输入条件</text><rect x="350" y="232" width="145" height="76" rx="7" fill="#e8f1de" stroke="#cad6c0"/><text x="422" y="261" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">模型行动</text><text x="422" y="286" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">可训练输出</text><rect x="510" y="232" width="145" height="76" rx="7" fill="#edf0f1" stroke="#cad6c0"/><text x="582" y="261" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">工具返回</text><text x="582" y="286" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">输入条件</text><rect x="670" y="232" width="145" height="76" rx="7" fill="#e8f1de" stroke="#cad6c0"/><text x="742" y="261" font-size="16" fill="#516c45" text-anchor="middle" font-weight="600">模型摘要</text><text x="742" y="286" font-size="13" fill="#516c45" text-anchor="middle" font-weight="400">可训练输出</text><text x="30" y="345" font-size="16" fill="#516c45" text-anchor="start" font-weight="400">CompactionRL 把摘要也视作策略输出，用任务结果训练信息取舍。</text><text x="30" y="374" font-size="15" fill="#516c45" text-anchor="start" font-weight="400">输入提供决策条件；参与损失的输出 token 承接信用分配。</text></g></svg>