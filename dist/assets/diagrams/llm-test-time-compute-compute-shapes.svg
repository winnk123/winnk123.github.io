<circle cx="489" cy="239" r="9" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="315" y="294" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="start">三条尝试可并行生成</text>
<line x1="685" y1="130" x2="624" y2="187" stroke="#b77b38" stroke-width="2"/>
<line x1="685" y1="130" x2="747" y2="187" stroke="#b77b38" stroke-width="2"/>
