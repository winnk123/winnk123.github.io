<circle cx="93" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
<line x1="132" y1="166" x2="171" y2="166" stroke="#35533c" stroke-width="2"/>
<circle cx="132" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
<line x1="171" y1="166" x2="210" y2="166" stroke="#35533c" stroke-width="2"/>
<circle cx="171" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
<line x1="210" y1="166" x2="249" y2="166" stroke="#35533c" stroke-width="2"/>
<circle cx="210" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
<circle cx="249" cy="166" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
