<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>候选里有正确解，选择器还要把它找出来</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">候选里有正确解，选择器还要把它找出来</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">构造例：5 × 3</text>
<rect x="30" y="70" width="370" height="266" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="46" y="98" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">同一份候选集合</text>
<rect x="50" y="96" width="45" height="34" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="72.5" y="119.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">A</text>
<text x="126" y="121" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="23" font-weight="400" fill="#b77b38" text-anchor="start">12</text>
<text x="213" y="121" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="start">未通过检查</text>
<rect x="50" y="148" width="45" height="34" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="72.5" y="171.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">B</text>
<text x="126" y="173" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="23" font-weight="400" fill="#b77b38" text-anchor="start">12</text>
<text x="213" y="173" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="start">未通过检查</text>
<rect x="50" y="200" width="45" height="34" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="72.5" y="223.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">C</text>
<text x="126" y="225" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="23" font-weight="400" fill="#b77b38" text-anchor="start">12</text>
<text x="213" y="225" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="start">未通过检查</text>
<rect x="50" y="252" width="45" height="34" rx="7" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="72.5" y="275.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="middle">D</text>
<text x="126" y="277" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="23" font-weight="400" fill="#35533c" text-anchor="start">15</text>
<text x="213" y="277" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">通过算式检查</text>
<rect x="435" y="70" width="375" height="115" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="451" y="98" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">按出现次数投票</text>
<text x="456" y="137" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="400" fill="#b77b38" text-anchor="start">12 得 3 票 → 选择 12</text>
<rect x="435" y="204" width="375" height="132" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="451" y="232" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">逐项验证后选择</text>
<text x="456" y="266" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="400" fill="#35533c" text-anchor="start">5 × 3 = 15 → 选择 D</text>
<text x="456" y="306" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">候选发现正确解；检查完成选择</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">四个候选是人为构造的反例；多数票与验证器对同一候选集合做不同判断。</text>
</svg>