<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>同样三幅画面，时间间隔改变图像运动速度</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">同样三幅画面，时间间隔改变图像运动速度</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">像素位移示意</text>
<rect x="38" y="80" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="53" y1="135" x2="163" y2="135" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="65" cy="115" r="11" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="108" y="180" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="middle">0 秒</text>
<rect x="201" y="80" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="216" y1="135" x2="326" y2="135" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="258" cy="115" r="11" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="271" y="180" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="middle">1 秒</text>
<rect x="364" y="80" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="379" y1="135" x2="489" y2="135" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="451" cy="115" r="11" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="434" y="180" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="middle">2 秒</text>
<text x="551" y="119" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="start">总位移：60 像素</text>
<text x="551" y="153" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#35533c" text-anchor="start">60 像素 / 2 秒 = 30 像素/秒</text>
<rect x="38" y="212" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="53" y1="267" x2="163" y2="267" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="65" cy="247" r="11" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="108" y="312" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="middle">0 秒</text>
<rect x="201" y="212" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="216" y1="267" x2="326" y2="267" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="258" cy="247" r="11" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="271" y="312" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="middle">0.25 秒</text>
<rect x="364" y="212" width="140" height="73" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<line x1="379" y1="267" x2="489" y2="267" stroke="#d7e1d4" stroke-width="2"/>
<circle cx="451" cy="247" r="11" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="434" y="312" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="middle">0.5 秒</text>
<text x="551" y="251" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#47768a" text-anchor="start">总位移：60 像素</text>
<text x="551" y="285" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#47768a" text-anchor="start">60 像素 / 0.5 秒 = 120 像素/秒</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">示例保持画面尺度一致；时间戳支持比较图像中的运动快慢，结果单位为像素/秒。</text>
</svg>