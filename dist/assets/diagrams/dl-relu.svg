<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">非线性来自哪里</title><desc id="desc">ReLU 在零点改变斜率：负输入输出零，正输入原样通过，多层网络由此组合出更复杂的关系。</desc><rect width="840" height="400" fill="#fff"/><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><text x="50" y="37" font-size="23" fill="#35533c" text-anchor="start" font-weight="600">激活函数把一条直线折成分段关系</text><path d="M75 272L365 272" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M356.22417438109625 276.79425538604204L365 272L356.22417438109625 267.20574461395796" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M175 352L175 102" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M179.79425538604204 110.77582561890372L175 102L170.20574461395796 110.77582561890372" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M95 352L345 102" stroke="#47768a" stroke-width="3" fill="none"/><circle cx="175" cy="272" r="5" fill="#47768a"/><text x="155" y="79" font-size="20" fill="#47768a" text-anchor="start" font-weight="400">线性：输出 = z</text><text x="175" y="297" font-size="15" fill="#657461" text-anchor="start" font-weight="400">0</text><text x="365" y="298" font-size="16" fill="#657461" text-anchor="end" font-weight="400">输入 z</text><text x="160" y="111" font-size="16" fill="#657461" text-anchor="end" font-weight="400">输出</text><path d="M485 292L775 292" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M766.2241743810963 296.79425538604204L775 292L766.2241743810963 287.20574461395796" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M585 352L585 102" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M589.794255386042 110.77582561890372L585 102L580.205744613958 110.77582561890372" stroke="#657461" stroke-width="2.5" fill="none"/><path d="M505 292L585 292" stroke="#b77b38" stroke-width="4" fill="none"/><path d="M585 292L755 122" stroke="#b77b38" stroke-width="4" fill="none"/><circle cx="585" cy="292" r="5" fill="#b77b38"/><text x="537" y="79" font-size="20" fill="#b77b38" text-anchor="start" font-weight="400">ReLU：max(0, z)</text><text x="585" y="315" font-size="15" fill="#657461" text-anchor="start" font-weight="400">0</text><text x="775" y="318" font-size="16" fill="#657461" text-anchor="end" font-weight="400">输入 z</text><text x="570" y="111" font-size="16" fill="#657461" text-anchor="end" font-weight="400">输出</text><text x="198" y="388" font-size="18" fill="#47768a" text-anchor="middle" font-weight="400">负输入继续保留</text><text x="625" y="388" font-size="18" fill="#b77b38" text-anchor="middle" font-weight="400">负输入变为 0，正输入保留</text></g></svg>