00" y2="245.00" stroke="#a2afa3" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="716.00" y="175.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" fill="#b77b38" text-anchor="start">Xc</text><text x="60.00" y="281.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" fill="#35533c" text-anchor="start">光心 C</text><text x="352.00" y="173.23" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" fill="#47768a" text-anchor="start">像点</text><text x="706.00" y="71.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" fill="#b77b38" text-anchor="start">空间点 P</text><line x1="120.00" y1="316.00" x2="340.00" y2="316.00" stroke="#a2afa3" stroke-width="1.6" stroke-linecap="round"/><line x1="120.00" y1="307.00" x2="120.00" y2="325.00" stroke="#a2afa3" stroke-width="2" stroke-linecap="round"/><line x1="340.00" y1="307.00" x2="340.00" y2="325.00" stroke="#a2afa3" stroke-width="2" stroke-linecap="round"/><text x="210.00" y="343.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" fill="#47768a" text-anchor="start">焦距 f</text><rect x="460" y="272" width="324" height="69" rx="9" fill="white" stroke="#dce5dc"/><text x="486.00" y="315.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" fill="#35533c" text-anchor="start">像点高度 = f × Xc / Zc</text><text x="26.00" y="378.00" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" fill="#35533c" text-anchor="start">针孔侧视示意，忽略畸变：深度归一化将三维点变成视线方向。</text></svg>