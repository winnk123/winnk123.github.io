<text x="347" y="175" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#637265" text-anchor="middle">监督 0</text>
<rect x="421" y="105" width="111" height="40" rx="7" fill="#e6eee3" stroke="none" stroke-width="1"/>
