<text x="296" y="309" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="middle">4 个参数</text>
<text x="372" y="292" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="24" font-weight="400" fill="#35533c" text-anchor="start">×</text>
<rect x="408" y="247" width="147" height="76" rx="8" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="481" y="280" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">A：1 × 6</text>
<text x="481" y="309" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="middle">6 个参数</text>
<text x="590" y="278" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="20" font-weight="400" fill="#35533c" text-anchor="start">增量仍是 4 × 6</text>
<text x="590" y="308" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#b77b38" text-anchor="start">只训练 4 + 6 = 10 项</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">图中只监督助手段；低秩示例取秩 1，并省略 LoRA 的缩放系数。</text>
</svg>