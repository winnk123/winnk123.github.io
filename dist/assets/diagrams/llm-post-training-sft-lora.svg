<line x1="30" y1="195" x2="810" y2="195" stroke="#d7e1d4" stroke-width="2"/>
<text x="33" y="229" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="20" font-weight="400" fill="#35533c" text-anchor="start">LoRA：用低秩增量表示权重更新</text>
<rect x="35" y="247" width="148" height="76" rx="8" fill="#e4edf1" stroke="none" stroke-width="1"/>
<text x="109" y="280" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#47768a" text-anchor="middle">原权重 W</text>
<text x="109" y="309" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#637265" text-anchor="middle">4 × 6，冻结</text>
<text x="201" y="292" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="24" font-weight="400" fill="#35533c" text-anchor="start">+</text>
<rect x="237" y="247" width="118" height="76" rx="8" fill="#f2e7d8" stroke="none" stroke-width="1"/>
