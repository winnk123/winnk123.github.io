<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>把同一段文字错开一位，就得到训练目标</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">把同一段文字错开一位，就得到训练目标</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">样本示意</text>
<text x="36" y="112" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#35533c" text-anchor="start">模型读入</text>
<text x="36" y="205" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#b77b38" text-anchor="start">预测目标</text>
<rect x="158" y="84" width="127" height="40" rx="7" fill="#e6eee3" stroke="none" stroke-width="1"/>
<text x="221.5" y="110.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="middle">机械</text>
<rect x="158" y="177" width="127" height="40" rx="7" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="221.5" y="203.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">臂</text>
<line x1="221" y1="130" x2="221" y2="166" stroke="#47768a" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="307" y="84" width="127" height="40" rx="7" fill="#e6eee3" stroke="none" stroke-width="1"/>
<text x="370.5" y="110.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="middle">臂</text>
<rect x="307" y="177" width="127" height="40" rx="7" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="370.5" y="203.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">抓起</text>
<line x1="370" y1="130" x2="370" y2="166" stroke="#47768a" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="456" y="84" width="127" height="40" rx="7" fill="#e6eee3" stroke="none" stroke-width="1"/>
<text x="519.5" y="110.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="middle">抓起</text>
<rect x="456" y="177" width="127" height="40" rx="7" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="519.5" y="203.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">方块</text>
<line x1="519" y1="130" x2="519" y2="166" stroke="#47768a" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="605" y="84" width="127" height="40" rx="7" fill="#e6eee3" stroke="none" stroke-width="1"/>
<text x="668.5" y="110.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#35533c" text-anchor="middle">方块</text>
<rect x="605" y="177" width="127" height="40" rx="7" fill="#f2e7d8" stroke="none" stroke-width="1"/>
<text x="668.5" y="203.0" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="middle">。</text>
<line x1="668" y1="130" x2="668" y2="166" stroke="#47768a" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="36" y="255" width="360" height="79" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="54" y="284" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#26372c" text-anchor="start">“机械 臂 抓起” 只用于预测 “方块”</text>
<text x="54" y="312" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="start">每个位置都形成一次监督信号</text>
<rect x="420" y="255" width="384" height="79" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="438" y="284" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#26372c" text-anchor="start">若给真实目标的概率为 0.6</text>
<text x="438" y="312" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="18" font-weight="400" fill="#b77b38" text-anchor="start">该位置误差：−ln(0.6) ≈ 0.511</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">词元切分采用示意；训练时用因果掩码让每个预测只读取自己的前缀。</text>
</svg>