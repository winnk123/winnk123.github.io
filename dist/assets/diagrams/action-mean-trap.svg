<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="title desc"><title id="title">两种正确动作，平均后会走向哪里？</title><desc id="desc">对称左右绕行均可避开障碍，等概率直接动作回归的均值指向障碍；右侧显示两个动作模式的概率。</desc><defs><marker id="arrow-g" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#35533c"/></marker><marker id="arrow-b" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#47768a"/></marker><marker id="arrow-o" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#b77b38"/></marker><marker id="arrow-m" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#617565"/></marker></defs><rect width="840" height="400" rx="18" fill="#f7faf5"/><text x="28" y="37" fill="#35533c" font-size="22" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="700">两种正确动作，平均后会走向哪里？</text><path d="M461,70 L461,337" fill="none" stroke="#d6e1d2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="247" cy="222" r="48" fill="#f4eadc" stroke="#b77b38" stroke-width="2"/><text x="247" y="229" fill="#b77b38" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">障碍物</text><path d="M247,316 C110,294 110,144 247,111" fill="none" stroke="#35533c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-g)"/><path d="M247,316 C384,294 384,144 247,111" fill="none" stroke="#47768a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-b)"/><path d="M247,312 L247,252" fill="none" stroke="#b77b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 6" marker-end="url(#arrow-o)"/><circle cx="247" cy="316" r="8" fill="#35533c" stroke="none" stroke-width="2"/><circle cx="247" cy="104" r="9" fill="#ffffff" stroke="#35533c" stroke-width="3"/><text x="247" y="84" fill="#35533c" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">共同目标</text><text x="247" y="343" fill="#35533c" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">同一观测与起点</text><text x="72" y="179" fill="#35533c" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">向左绕</text><text x="365" y="179" fill="#47768a" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">向右绕</text><text x="65" y="203" fill="#35533c" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">a = −1</text><text x="365" y="203" fill="#47768a" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">a = +1</text><text x="277" y="290" fill="#b77b38" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">均值 a = 0</text><text x="496" y="93" fill="#35533c" font-size="20" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">动作概率</text><path d="M510,258 L794,258" fill="none" stroke="#617565" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="530" y="145" width="50" height="113" rx="5" fill="#35533c" stroke="none" stroke-width="1"/><text x="555" y="132" fill="#35533c" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.5</text><rect x="719" y="145" width="50" height="113" rx="5" fill="#47768a" stroke="none" stroke-width="1"/><text x="744" y="132" fill="#47768a" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0.5</text><circle cx="650" cy="258" r="6" fill="#b77b38" stroke="none" stroke-width="2"/><text x="555" y="285" fill="#35533c" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">−1</text><text x="650" y="285" fill="#b77b38" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">0</text><text x="744" y="285" fill="#47768a" font-size="18" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">+1</text><text x="650" y="318" fill="#263e30" font-size="17" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="middle" font-weight="400">E[a] = 0.5×(−1) + 0.5×1 = 0</text><path d="M28,355 L812,355" fill="none" stroke="#d6e1d2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="28" y="381" fill="#617565" font-size="16" font-family="Noto Sans CJK SC, Noto Sans SC, system-ui, sans-serif" text-anchor="start" font-weight="400">示意：左右路线对称且等概率；直接平方误差回归得到中间动作。</text></svg>