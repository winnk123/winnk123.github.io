<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title desc"><title id="title">输入与学到的变化相加</title><desc id="desc">中间分支学习 F(x)，上方通路直接传递 x；两条通路在加号处汇合。该结构也支持梯度直接传播。</desc><rect width="840" height="400" fill="#fff"/><g font-family="Noto Sans CJK SC,Noto Sans SC,Arial,sans-serif"><text x="50" y="37" font-size="23" fill="#35533c" text-anchor="start" font-weight="600">残差连接给信息增加一条直接通路</text><rect x="55" y="165" width="110" height="65" rx="9" fill="#fff" stroke="#35533c"/><text x="110.0" y="197" font-size="21" fill="#35533c" text-anchor="middle" font-weight="500">x</text><rect x="285" y="140" width="240" height="115" rx="9" fill="#fff" stroke="#47768a"/><text x="405.0" y="172" font-size="21" fill="#47768a" text-anchor="middle" font-weight="500">F(x)</text><text x="405.0" y="201" font-size="16" fill="#657461" text-anchor="middle" font-weight="400">可学习的多层变换</text><circle cx="645" cy="197" r="28" fill="#35533c"/><text x="645" y="205" font-size="27" fill="#fff" text-anchor="middle" font-weight="400">+</text><text x="735" y="204" font-size="24" fill="#35533c" text-anchor="middle" font-weight="400">y</text><path d="M172 197L277 197" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M268.22417438109625 201.79425538604204L277 197L268.22417438109625 192.20574461395796" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M533 197L610 197" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M601.2241743810963 201.79425538604204L610 197L601.2241743810963 192.20574461395796" stroke="#47768a" stroke-width="2.5" fill="none"/><path d="M680 197L718 197" stroke="#35533c" stroke-width="2.5" fill="none"/><path d="M709.2241743810963 201.79425538604204L718 197L709.2241743810963 192.20574461395796" stroke="#35533c" stroke-width="2.5" fill="none"/><path d="M110 158V91H645V161" stroke="#b77b38" stroke-width="3" fill="none"/><path d="M645 130L645 160" stroke="#b77b38" stroke-width="2.5" fill="none"/><path d="M640.205744613958 151.22417438109628L645 160L649.794255386042 151.22417438109628" stroke="#b77b38" stroke-width="2.5" fill="none"/><text x="385" y="79" font-size="18" fill="#b77b38" text-anchor="middle" font-weight="400">直接保留 x</text><rect x="170" y="295" width="500" height="60" rx="9" fill="#f4f7ef" stroke="#d9e3d3"/><text x="420" y="333" font-size="23" fill="#35533c" text-anchor="middle" font-weight="400">输出 y = x + F(x)</text><text x="420" y="382" font-size="17" fill="#657461" text-anchor="middle" font-weight="400">学习新变换时，已有表示仍沿跳跃通路传递</text></g></svg>