<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img">
<title>直线路径的流匹配：学习当前位置该往哪里移动</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#35533c"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#47768a"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b77b38"/></marker></defs>
<rect width="840" height="400" rx="18" fill="#f5f8f3"/>
<text x="30" y="38" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="22" font-weight="600" fill="#35533c" text-anchor="start">直线路径的流匹配：学习当前位置该往哪里移动</text>
<text x="810" y="37" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="15" font-weight="400" fill="#637265" text-anchor="end">二维训练对示意</text>
<rect x="30" y="74" width="430" height="257" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="46" y="102" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">一对噪声与数据的插值</text>
<line x1="97" y1="260" x2="411" y2="260" stroke="#d7e1d4" stroke-width="2"/>
<line x1="97" y1="260" x2="97" y2="156" stroke="#d7e1d4" stroke-width="2"/>
<line x1="97" y1="260" x2="384" y2="182" stroke="#47768a" stroke-width="3" marker-end="url(#arrow-blue)"/>
<circle cx="97" cy="260" r="9" fill="#47768a" stroke="none" stroke-width="1"/>
<text x="97" y="293" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="middle">t = 0</text>
<circle cx="240" cy="221" r="9" fill="#b77b38" stroke="none" stroke-width="1"/>
<text x="240" y="254" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#b77b38" text-anchor="middle">t = 0.5</text>
<circle cx="384" cy="182" r="9" fill="#35533c" stroke="none" stroke-width="1"/>
<text x="384" y="215" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="middle">t = 1</text>
<text x="64" y="141" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#47768a" text-anchor="start">噪声 x_0 = (0, 0)</text>
<text x="252" y="141" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="17" font-weight="400" fill="#35533c" text-anchor="start">数据 x_1 = (2, 1)</text>
<rect x="490" y="74" width="320" height="257" rx="8" fill="#ffffff" stroke="#d7e1d4" stroke-width="1"/>
<text x="506" y="102" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="600" fill="#35533c" text-anchor="start">这条路径的训练目标</text>
<text x="512" y="137" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#26372c" text-anchor="start">位置：x_t = (1−t)x_0 + tx_1</text>
<text x="512" y="185" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#26372c" text-anchor="start">速度：v = x_1 − x_0</text>
<text x="512" y="233" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="19" font-weight="400" fill="#26372c" text-anchor="start">本例：v = (2, 1)</text>
<text x="512" y="298" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#b77b38" text-anchor="start">半步： (0, 0) + 0.5v = (1, 0.5)</text>
<line x1="30" y1="354" x2="810" y2="354" stroke="#d7e1d4" stroke-width="2"/>
<text x="30" y="380" font-family="Noto Sans CJK SC,Noto Sans SC,system-ui,sans-serif" font-size="16" font-weight="400" fill="#637265" text-anchor="start">图示一条直线插值训练样本；网络学习由当前状态和时间预测速度。</text>
</svg>